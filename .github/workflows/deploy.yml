name: Deploy to Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT_NAME: slowmadly

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build for Cloudflare Pages
        env:
          NEXT_PUBLIC_SITE_URL: https://slowmadly.com
          NEXT_PUBLIC_SITE_NAME: Slowmadly
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_AFF_SAFETYWING: ${{ secrets.NEXT_PUBLIC_AFF_SAFETYWING }}
          NEXT_PUBLIC_AFF_TRAVELPAYOUTS: ${{ secrets.NEXT_PUBLIC_AFF_TRAVELPAYOUTS }}
          NEXT_PUBLIC_AFF_VIATOR: ${{ secrets.NEXT_PUBLIC_AFF_VIATOR }}
          NEXT_PUBLIC_AFF_FIVERR: ${{ secrets.NEXT_PUBLIC_AFF_FIVERR }}
          NEXT_PUBLIC_AFF_APPSUMO: ${{ secrets.NEXT_PUBLIC_AFF_APPSUMO }}
        run: npx @cloudflare/next-on-pages@latest

      - name: Merge scanner-exclusion routes into _routes.json
        run: node scripts/finalize-routes.mjs

      - name: Wrap worker to override Cache-Control on locale pages
        run: node scripts/wrap-worker.mjs

      - name: Deploy to Cloudflare Pages
        id: deploy
        # Force --branch=main on every push so the deploy is promoted to the
        # production custom domain (slowmadly.com). Without this, pushes to
        # the feature branch land on the preview alias only, and the apex
        # keeps serving an older worker (notably without our cache-control
        # wrap).
        run: |
          npx wrangler@latest pages deploy .vercel/output/static \
            --project-name="${PROJECT_NAME}" \
            --branch="main" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_REF_NAME}: $(git log -1 --pretty=%s | head -c 80)"
